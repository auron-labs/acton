[extend]
useDefault = true

# Pen stores its document UUID as fileToken, which is not an API credential.
[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^acton\.pen$']
regexTarget = "line"
regexes = ['''^\s*"fileToken": "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"\s*$''']

# Limit the exemption to passwords used as test fixtures; other secret rules
# continue to scan these files.
[[allowlists]]
targetRules = ["generic-password"]
paths = [
    '^tests/',
    '\.(?:test|spec)\.(?:js|jsx|ts|tsx|mjs|cjs|mts|cts)$',
    '(?:^|/)__tests__/',
]
