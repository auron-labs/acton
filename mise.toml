# Prerequisites: Git for checks, a running Docker engine for act workflows,
# and Xcode command-line tools for native macOS development and packaging.
[tools]
betterleaks = "1.9.0"
go = "1.27.3"
golangci-lint = "2.15.0"
hk = { version = "2.9.0", workflow = "release.yml" }
"npm:@ls-lint/ls-lint" = "2.3.2"
node = "26.12.1"
pkl = "0.32.2"

[env]
BETTERLEAKS_CONFIG = "{{ config_root }}/.betterleaks.toml"

[tasks.setup-go-git]
description = "Generate third_party/go-git (pinned version plus local patch)"
run = "scripts/setup-go-git.sh"

[tasks.update-go-git]
description = "Bump the pinned go-git version: update-go-git [version|latest]"
run = "scripts/update-go-git.sh"

[tasks.dev]
description = "Run the app in development mode with live reload"
run = "go tool mygo dev"
depends = ["setup-go-git"]

[tasks.build]
description = "Build the macOS app bundle into build/"
run = "go tool mygo build"
depends = ["setup-go-git"]

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."
depends = ["setup-go-git"]

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."
depends = ["setup-go-git"]

[tasks.check]
description = "Run all hk checks (format, lint, tidy, secrets) without fixing"
run = "hk check --all"
depends = ["setup-go-git"]

[tasks.fix]
description = "Run all hk checks and apply automatic fixes"
run = "hk fix --all"
depends = ["setup-go-git"]

[tasks."build:run"]
description = "Build and open the macOS app"
run = "open build/darwin-arm64/acton.app"
depends = ["build"]
