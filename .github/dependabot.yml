version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
updates:
  - package-ecosystem: gomod
    directory: "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # Patched copy in third_party/go-git; upgrade with `mise run update-go-git`.
      - dependency-name: github.com/go-git/go-git/v5
  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
